<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review · metadata cleanup</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --panel2: #1c212a; --line: #2a303b;
    --text: #e6e8ec; --dim: #8b93a1; --faint: #5c6370;
    --gold: #e0b252; --model: #5aa9e6; --alt: #6cc0b4; --edit: #b48ead; --ok: #6cc08b;
    --warn: #e5a04c; --bad: #e06c75;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }

  header { display: flex; align-items: center; gap: 16px; padding: 10px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .run { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .progress { flex: 1; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--model), var(--ok)); transition: width .2s; }
  .progress-label { font-family: var(--mono); font-size: 12px; color: var(--dim); min-width: 120px; text-align: right; }
  .save { font-family: var(--mono); font-size: 12px; color: var(--faint); min-width: 70px; }
  .save.saving { color: var(--warn); } .save.saved { color: var(--ok); } .save.error { color: var(--bad); }

  nav { display: flex; gap: 4px; padding: 8px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  nav button { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; color: var(--dim); }
  nav button:hover { color: var(--text); background: var(--panel2); }
  nav button.active { color: var(--text); background: var(--panel2); border-color: var(--line); }
  nav .count { font-family: var(--mono); font-size: 11px; margin-left: 6px; color: var(--faint); }
  nav .spacer { flex: 1; }
  nav input { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; color: var(--text);
    padding: 4px 10px; width: 240px; font: inherit; }

  main { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  .list { overflow-y: auto; overflow-x: hidden; border-right: 1px solid var(--line); background: var(--panel); }
  .item { padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid;
    grid-template-columns: 10px 1fr; gap: 10px; align-items: start; }
  .item > div { min-width: 0; }
  .item:hover { background: var(--panel2); }
  .item.active { background: #222936; box-shadow: inset 3px 0 0 var(--model); }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: var(--faint); }
  .dot.model { background: var(--model); } .dot.alt { background: var(--alt); } .dot.gold { background: var(--gold); }
  .dot.edited { background: var(--edit); } .dot.unclear { background: var(--warn); } .dot.exclude { background: var(--bad); }
  .dot.agree, .dot.auto { background: var(--ok); }
  .item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .chips { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
  .chip { font-family: var(--mono); font-size: 10px; padding: 0 5px; border-radius: 3px; background: var(--panel2); color: var(--dim); border: 1px solid var(--line); }
  .chip.fail { color: var(--bad); border-color: #4a2a2e; }
  .chip.change { color: var(--model); border-color: #2c4a63; }

  .detail { overflow-y: auto; padding: 22px 28px 120px; }
  .empty { color: var(--dim); padding: 60px; text-align: center; }
  .raw-title { font-size: 21px; font-weight: 600; margin: 0 0 6px; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--dim); font-size: 13px; margin-bottom: 12px; }
  .meta b { color: var(--text); font-weight: 500; }
  .meta a { color: var(--model); }
  .path { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-bottom: 14px; }
  audio { width: 100%; height: 34px; margin: 4px 0 14px; }
  details.desc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 18px; }
  details.desc summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  details.desc pre { white-space: pre-wrap; font: 12px/1.5 var(--mono); color: var(--dim); margin: 8px 0 0; }

  table.fields { width: 100%; border-collapse: separate; border-spacing: 0 6px; table-layout: fixed; }
  .fields th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; padding: 0 8px; }
  .fields th.left { color: var(--gold); } .fields th.a { color: var(--model); } .fields th.b { color: var(--alt); } .fields th.f { color: var(--edit); }
  .fields th.name { width: 86px; }
  .fields td { vertical-align: top; padding: 0 4px; }
  .fields td.name { color: var(--dim); font-size: 12px; padding-top: 10px; }
  .fields tr.diff td.name { color: var(--bad); }
  .cell { width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 10px; min-height: 38px; word-break: break-word; }
  .cell:hover { border-color: var(--dim); }
  .cell.left.picked { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .cell.a.picked { border-color: var(--model); box-shadow: 0 0 0 1px var(--model) inset; }
  .cell.b.picked { border-color: var(--alt); box-shadow: 0 0 0 1px var(--alt) inset; }
  .cell .empty-val { color: var(--faint); font-style: italic; }
  .final { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; color: var(--text);
    padding: 8px 10px; font: inherit; min-height: 38px; }
  .final:focus { outline: none; border-color: var(--edit); }
  .hint { font-size: 11px; color: var(--faint); margin: 2px 0 0 92px; }

  .notes { margin: 18px 0; padding: 10px 14px; border-left: 3px solid var(--model); background: var(--panel); border-radius: 0 7px 7px 0; color: var(--dim); }
  .notes .conf { font-family: var(--mono); color: var(--text); margin-right: 8px; }
  .verdict-badge { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-left: 10px; vertical-align: middle; color: #111; }

  .actions { position: fixed; bottom: 0; left: 340px; right: 0; display: flex; gap: 8px; padding: 12px 28px;
    background: rgba(15,17,21,.94); border-top: 1px solid var(--line); backdrop-filter: blur(6px); flex-wrap: wrap; }
  .actions button { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; }
  .actions button:hover { border-color: var(--dim); }
  .actions kbd { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-right: 6px; }
  .actions .a { border-color: #2c4a63; } .actions .b { border-color: #2a5550; } .actions .left { border-color: #5c4b26; } .actions .save-edit { border-color: #4b3b4a; }
  .actions .spacer { flex: 1; }
  .help { color: var(--faint); font-size: 12px; align-self: center; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="heading">Review</h1>
    <span class="run" id="run"></span>
    <div class="progress"><div id="bar" style="width:0"></div></div>
    <span class="progress-label" id="progress"></span>
    <span class="save" id="save"></span>
  </header>
  <nav id="tabs"></nav>
  <main>
    <div class="list" id="list"></div>
    <div class="detail" id="detail"><div class="empty">Loading…</div></div>
  </main>
</div>
<div class="actions" id="actions"></div>

<script>
const FIELDS = [
  { key: "title", label: "Title", list: false },
  { key: "credited_artists", label: "Artists", list: true },
  { key: "remixers", label: "Remixers", list: true },
];
const VERDICT_COLORS = { model: "var(--model)", alt: "var(--alt)", gold: "var(--gold)", edited: "var(--edit)", unclear: "var(--warn)", exclude: "var(--bad)", auto: "var(--ok)" };
// Source column for each pick verdict.
const SOURCE_OF = { model: "a", alt: "b", gold: "left" };

const MODES = {
  gold: {
    heading: "Gold review",
    tabs: [["todo", "To sort"], ["model", "Model right"], ["gold", "Gold right"], ["edited", "Edited"],
           ["unclear", "Unclear"], ["exclude", "Excluded"], ["agree", "Agreed"], ["all", "All"]],
    actions: [["model", "1", "Model right", "a"], ["gold", "2", "Gold right", "left"]],
    defaultTab: "todo",
  },
  apply: {
    heading: "Apply review",
    tabs: [["todo", "To review"], ["auto", "Auto (runs agree)"], ["model", "Run A"], ["alt", "Run B"],
           ["gold", "Keep current"], ["edited", "Edited"], ["unclear", "Unclear"], ["exclude", "Skip"], ["all", "All"]],
    actions: [["model", "1", "Use run A", "a"], ["alt", "3", "Use run B", "b"], ["gold", "2", "Keep current", "left"]],
    defaultTab: "todo",
  },
};

const state = { mode: "gold", labels: {}, rows: [], corrections: {}, tab: "todo", activeId: null, query: "", drafts: {} };
const cfg = () => MODES[state.mode];

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toText = (v, list) => (list ? (v || []).join("; ") : v || "");
const fromText = (s, list) => (list ? s.split(";").map((x) => x.trim()).filter(Boolean) : s.trim());
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const pick = (obj) => Object.fromEntries(FIELDS.map((f) => [f.key, obj[f.key]]));
const anyDiff = (row) => FIELDS.some((f) => row.diff[f.key]);
const sources = () => (state.mode === "apply" ? ["left", "a", "b"] : ["left", "a"]);
const changedFromCurrent = (row) => FIELDS.filter((f) => !same(row.left[f.key], row.a[f.key]));

function status(row) {
  const c = state.corrections[row.id];
  if (c) return c.verdict;
  if (state.mode === "apply") return row.auto ? "auto" : "todo";
  return anyDiff(row) ? "todo" : "agree";
}

const inTab = (row, tab) => tab === "all" || status(row) === tab;

function visibleRows() {
  const q = state.query.toLowerCase();
  return state.rows.filter((r) => inTab(r, state.tab) && (!q || JSON.stringify([r.raw.title, r.raw.uploader, r.left, r.a]).toLowerCase().includes(q)));
}

function draftFor(row) {
  if (state.drafts[row.id]) return state.drafts[row.id];
  const c = state.corrections[row.id];
  const base = c && c.expected ? c.expected : pick(row.a);
  state.drafts[row.id] = structuredClone(base);
  return state.drafts[row.id];
}

function renderTabs() {
  const tabs = cfg().tabs;
  const counts = Object.fromEntries(tabs.map(([k]) => [k, state.rows.filter((r) => inTab(r, k)).length]));
  document.getElementById("tabs").innerHTML =
    tabs.map(([k, label]) => `<button data-tab="${k}" class="${k === state.tab ? "active" : ""}">${label}<span class="count">${counts[k]}</span></button>`).join("") +
    `<span class="spacer"></span><input id="search" placeholder="Search title, artist…" value="${esc(state.query)}">`;
  const pending = state.rows.filter((r) => (state.mode === "apply" ? !r.auto : anyDiff(r)));
  const done = pending.filter((r) => state.corrections[r.id]).length;
  document.getElementById("bar").style.width = `${pending.length ? (100 * done) / pending.length : 100}%`;
  document.getElementById("progress").textContent = `${done} / ${pending.length} decided`;
}

function rowChips(row) {
  if (state.mode === "apply" && row.auto) {
    return changedFromCurrent(row).map((f) => `<span class="chip change">${f.label.toLowerCase()}</span>`).join("") || `<span class="chip">no change</span>`;
  }
  return FIELDS.filter((f) => row.diff[f.key]).map((f) => `<span class="chip fail">${f.label.toLowerCase()}</span>`).join("");
}

function renderList() {
  const rows = visibleRows();
  document.getElementById("list").innerHTML = rows.map((r) => `
    <div class="item ${r.id === state.activeId ? "active" : ""}" data-id="${esc(r.id)}">
      <span class="dot ${status(r)}"></span>
      <div><div class="t">${esc(r.raw.title || r.raw.filename)}</div>
      <div class="chips">${rowChips(r)}<span class="chip">${esc(r.raw.uploader || "")}</span></div></div>
    </div>`).join("") || `<div class="empty">Nothing here.</div>`;
  const active = document.querySelector(".item.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

function cellHtml(row, field, source) {
  const value = row[source][field.key];
  const text = toText(value, field.list);
  const picked = same(draftFor(row)[field.key], value);
  return `<button class="cell ${source} ${picked ? "picked" : ""}" data-pick="${source}" data-field="${field.key}">
    ${text ? esc(text) : `<span class="empty-val">none</span>`}</button>`;
}

function renderActions() {
  const picks = cfg().actions.map(([act, key, label, cls]) => `<button class="${cls}" data-act="${act}"><kbd>${key}</kbd>${label}</button>`).join("");
  document.getElementById("actions").innerHTML = picks + `
    <button class="save-edit" data-act="save"><kbd>⏎</kbd>Save picks / edits</button>
    <button data-act="unclear"><kbd>U</kbd>Unclear</button>
    <button data-act="exclude"><kbd>X</kbd>${state.mode === "apply" ? "Skip" : "Exclude"}</button>
    <button data-act="reset"><kbd>0</kbd>Reset</button>
    <span class="spacer"></span>
    <span class="help">J/K move · click a cell to pick per field · E edit · P play</span>`;
}

function renderDetail() {
  const row = state.rows.find((r) => r.id === state.activeId);
  const el = document.getElementById("detail");
  if (!row) { el.innerHTML = `<div class="empty">Pick a track on the left.</div>`; return; }
  const raw = row.raw, draft = draftFor(row), c = state.corrections[row.id];
  const verdict = c ? c.verdict : row.auto && state.mode === "apply" ? "auto" : null;
  const badge = verdict ? `<span class="verdict-badge" style="background:${VERDICT_COLORS[verdict]}">${verdict}</span>` : "";
  const meta = [
    ["Uploader", raw.uploader], ["metadata_artist", raw.metadata_artist], ["Genre", raw.genre],
    ["Label", raw.label_name], ["Release", raw.release], ["Year", raw.release_year], ["Tags", raw.tag_list],
  ].filter(([, v]) => v).map(([k, v]) => `<span>${k}: <b>${esc(v)}</b></span>`).join("");
  const link = raw.url ? `<span><a href="${esc(raw.url)}" target="_blank" rel="noopener">SoundCloud ↗</a></span>` : "";
  const cols = sources();
  const head = `<tr><th class="name"></th>${cols.map((s) => `<th class="${s}">${esc(state.labels[s])}</th>`).join("")}<th class="f">Final</th></tr>`;
  const rowsHtml = FIELDS.map((f) => `
    <tr class="${row.diff[f.key] ? "diff" : ""}">
      <td class="name">${f.label}</td>
      ${cols.map((s) => `<td>${cellHtml(row, f, s)}</td>`).join("")}
      <td><input class="final" data-final="${f.key}" value="${esc(toText(draft[f.key], f.list))}"></td>
    </tr>`).join("");
  el.innerHTML = `
    <h2 class="raw-title">${esc(raw.title || raw.filename)}${badge}</h2>
    <div class="meta">${meta}${link}</div>
    <div class="path">${esc(row.id)}</div>
    <audio id="player" controls preload="none" src="/audio?id=${encodeURIComponent(row.id)}"></audio>
    ${raw.description ? `<details class="desc"><summary>Description</summary><pre>${esc(raw.description)}</pre></details>` : ""}
    <table class="fields">${head}${rowsHtml}</table>
    <div class="hint">Lists use “;” between names. Red rows: the compared columns disagree.</div>
    <div class="notes"><span class="conf">conf ${row.confidence}</span>${esc(row.notes || "no notes")}</div>`;
}

function render() { renderTabs(); renderList(); renderDetail(); }

let saveTimer = null;
function persist() {
  const el = document.getElementById("save");
  el.className = "save saving"; el.textContent = "saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const res = await fetch("/api/corrections", { method: "POST", body: JSON.stringify(state.corrections) });
      if (!res.ok) throw new Error(res.status);
      el.className = "save saved"; el.textContent = "saved";
    } catch (e) {
      el.className = "save error"; el.textContent = "save failed";
      console.error("save failed", e);
    }
  }, 250);
}

function readFinal(row) {
  const draft = draftFor(row);
  document.querySelectorAll(".final").forEach((input) => {
    const field = FIELDS.find((f) => f.key === input.dataset.final);
    draft[field.key] = fromText(input.value, field.list);
  });
  return draft;
}

function verdictFor(row, expected) {
  for (const [verdict, source] of Object.entries(SOURCE_OF)) {
    if (row[source] && same(expected, pick(row[source]))) return verdict;
  }
  return "edited";
}

function decide(act) {
  const row = state.rows.find((r) => r.id === state.activeId);
  if (!row) return;
  const at = new Date().toISOString();
  if (act === "reset") { delete state.corrections[row.id]; delete state.drafts[row.id]; persist(); render(); return; }
  if (SOURCE_OF[act]) {
    if (!row[SOURCE_OF[act]]) return;
    const expected = pick(row[SOURCE_OF[act]]);
    state.corrections[row.id] = { verdict: act, expected, at };
    state.drafts[row.id] = structuredClone(expected);
  } else if (act === "save") {
    const expected = structuredClone(readFinal(row));
    state.corrections[row.id] = { verdict: verdictFor(row, expected), expected, at };
  } else {
    state.corrections[row.id] = { verdict: act, expected: null, at };
  }
  persist();
  advance();
}

function advance() {
  if (["todo"].includes(state.tab)) {
    const next = visibleRows().find((r) => r.id !== state.activeId);
    state.activeId = next ? next.id : null;
    render();
  } else move(1);
}

function move(delta) {
  const rows = visibleRows();
  if (!rows.length) { render(); return; }
  const i = rows.findIndex((r) => r.id === state.activeId);
  const j = Math.max(0, Math.min(rows.length - 1, i < 0 ? 0 : i + delta));
  state.activeId = rows[j].id;
  render();
}

document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; state.activeId = visibleRows()[0]?.id ?? null; render(); return; }
  const item = e.target.closest(".item");
  if (item) { state.activeId = item.dataset.id; render(); return; }
  const cell = e.target.closest("[data-pick]");
  if (cell) {
    const row = state.rows.find((r) => r.id === state.activeId);
    readFinal(row);
    draftFor(row)[cell.dataset.field] = structuredClone(row[cell.dataset.pick][cell.dataset.field]);
    renderDetail(); return;
  }
  const act = e.target.closest("[data-act]");
  if (act) decide(act.dataset.act);
});

document.addEventListener("input", (e) => {
  if (e.target.id === "search") { state.query = e.target.value; renderList(); return; }
  if (e.target.classList.contains("final")) {
    const row = state.rows.find((r) => r.id === state.activeId);
    readFinal(row);
    document.querySelectorAll(".cell").forEach((cell) => {
      cell.classList.toggle("picked", same(draftFor(row)[cell.dataset.field], row[cell.dataset.pick][cell.dataset.field]));
    });
  }
});

document.addEventListener("keydown", (e) => {
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName);
  if (typing) {
    if (e.key === "Enter" && document.activeElement.classList.contains("final")) { e.preventDefault(); decide("save"); }
    if (e.key === "Escape") document.activeElement.blur();
    return;
  }
  const keys = {
    j: () => move(1), ArrowDown: () => move(1), k: () => move(-1), ArrowUp: () => move(-1),
    1: () => decide("model"), 2: () => decide("gold"), Enter: () => decide("save"),
    u: () => decide("unclear"), x: () => decide("exclude"), 0: () => decide("reset"),
    e: () => document.querySelector(".final")?.focus(),
    p: () => { const a = document.getElementById("player"); if (a) a.paused ? a.play() : a.pause(); },
  };
  if (state.mode === "apply") keys[3] = () => decide("alt");
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});

(async function init() {
  const data = await (await fetch("/api/data")).json();
  Object.assign(state, { mode: data.mode, labels: data.labels, rows: data.rows, corrections: data.corrections || {} });
  state.tab = cfg().defaultTab;
  document.getElementById("heading").textContent = cfg().heading;
  document.title = `${cfg().heading} · metadata cleanup`;
  document.getElementById("run").textContent = data.run;
  renderActions();
  state.activeId = visibleRows()[0]?.id ?? null;
  render();
})();
</script>
</body>
</html>
