# Organizer — read-only walk through the session screen.
# E2E runs against the real pi backend, and assigning a track to a linked
# bucket syncs it into a real playlist. So this flow never creates buckets
# or assigns tracks: it opens the bucket sheet and cancels it.
appId: com.musicminion.app
---
- launchApp
- tapOn:
    id: "tab-organize"
- assertVisible:
    id: "organizer-playlist-option"
- tapOn:
    id: "organizer-playlist-option"
# Session header names the playlist.
- assertVisible:
    id: "organizer-session-title"
- assertVisible:
    id: "organizer-session-counts"
# Tapping an unassigned track opens the bucket sheet without assigning.
# The sheet only appears if the session already has a bucket (we don't
# create one here), so this block is skipped on a bucketless session.
- runFlow:
    when:
      visible:
        id: "bucket-card-header"
    commands:
      - tapOn:
          id: "track-row"
      - assertVisible:
          id: "bucket-picker-sheet"
      - tapOn:
          id: "bucket-picker-cancel"
      - assertNotVisible:
          id: "bucket-picker-sheet"
      - assertNotVisible:
          text: "Tap to undo"
      - assertVisible:
          id: "track-row"
# One tap back lands on the picker, with a Resume entry.
- tapOn:
    id: "organizer-back-btn"
- assertVisible:
    id: "organizer-resume-btn"
- assertVisible:
    id: "organizer-playlist-option"
