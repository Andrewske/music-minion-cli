# Comparison — pick a playlist → play a card → vote → exit back to the picker.
# NOTE: this casts ONE real vote against the live backend (changes ELO for one
# pair in the first manual playlist). The issue (#58) asks for the vote step.
# If the playlist is already "All caught up!", the session steps are skipped.
appId: com.musicminion.app
---
- launchApp
- tapOn:
    id: "tab-compare"
- extendedWaitUntil:
    visible:
      id: "comparison-playlist-option"
    timeout: 30000
- tapOn:
    id: "comparison-playlist-option"
- extendedWaitUntil:
    notVisible:
      id: "comparison-playlist-option"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "comparison-session"
    commands:
      # Everything fits one screen: header, both cards, vote buttons.
      - assertVisible:
          id: "comparison-exit"
      - assertVisible:
          id: "vote-a"
      - assertVisible:
          id: "vote-b"
      # Tap card A → global player loads it, card shows the playing state.
      - tapOn:
          id: "comparison-card-a"
      - extendedWaitUntil:
          visible:
            id: "comparison-card-a-playing"
          timeout: 30000
      - assertVisible:
          id: "player-track-title"
      # Vote via the button; session progress reflects this session.
      - tapOn:
          id: "vote-a"
      - extendedWaitUntil:
          visible:
            text: "1 vote this session"
          timeout: 30000
      # Exit from the header returns to the picker.
      - tapOn:
          id: "comparison-exit"
      - extendedWaitUntil:
          visible:
            id: "comparison-playlist-option"
          timeout: 30000
