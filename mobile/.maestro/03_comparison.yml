# Comparison — pick a playlist → play a card → vote buttons ready → exit.
# Non-destructive: E2E hits the live pi DB, so we never cast a vote (that
# would mutate ratings). We only assert the vote buttons are on screen and
# enabled. If the playlist is already "All caught up!", session steps skip.
appId: com.musicminion.app
---
- launchApp
- tapOn:
    id: "tab-compare"
- extendedWaitUntil:
    visible:
      id: "comparison-playlist-option"
    timeout: 30000
- tapOn:
    id: "comparison-playlist-option"
- extendedWaitUntil:
    notVisible:
      id: "comparison-playlist-option"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "comparison-session"
    commands:
      # Everything fits one screen: header, both cards, vote buttons.
      - assertVisible:
          id: "comparison-exit"
      - assertVisible:
          id: "vote-a"
      - assertVisible:
          id: "vote-b"
      # Tap card A → global player loads it, card shows the playing state.
      - tapOn:
          id: "comparison-card-a"
      - extendedWaitUntil:
          visible:
            id: "comparison-card-a-playing"
          timeout: 30000
      - assertVisible:
          id: "player-track-title"
      # Vote buttons visible and enabled. Do NOT tap (live ratings).
      - assertVisible:
          id: "vote-a"
          enabled: true
      - assertVisible:
          id: "vote-b"
          enabled: true
      - assertVisible:
          text: "No votes yet"
      # Exit from the header returns to the picker.
      - tapOn:
          id: "comparison-exit"
      - extendedWaitUntil:
          visible:
            id: "comparison-playlist-option"
          timeout: 30000
