# Scrobble — the playthrough counts as played once position reaches
# min(50% of duration, 30s), not before.
#
# Plays "the" first and then "love" so the scrobble track is always a fresh
# playthrough: re-playing the SAME track id keeps scrobbledThisPlaythrough
# from the previous run (syncState preserves it across same-track updates).
#
# Side effect: one real scrobble POST lands in the live play history.
appId: com.musicminion.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 30000
- runFlow:
    file: subflows/play_search_track.yml
    env:
      QUERY: "the"
# Close Now Playing (Modal onRequestClose).
- pressKey: Back
- runFlow:
    file: subflows/play_search_track.yml
    env:
      QUERY: "love"

- copyTextFrom:
    id: "seek-duration"
- runScript:
    file: scripts/clock-to-seconds.js
    env:
      KEY: "duration"
- evalScript: ${output.threshold = Math.min(output.duration / 2, 30)}

# Early in the track: not yet counted.
- assertNotVisible:
    id: "now-playing-scrobbled"

- extendedWaitUntil:
    visible:
      id: "now-playing-scrobbled"
    timeout: 60000
- copyTextFrom:
    id: "seek-position"
- runScript:
    file: scripts/clock-to-seconds.js
    env:
      KEY: "scrobbledAt"
- assertTrue:
    condition: ${output.scrobbledAt >= output.threshold - 2 && output.scrobbledAt <= output.threshold + 8}
    label: "Scrobble fired at min(50%, 30s)"
