# Browse + play — search a track and start playback.
appId: com.musicminion.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "nav-open"
    timeout: 30000
- runFlow:
    file: subflows/nav_to.yml
    env:
      DEST: "home"
- tapOn:
    id: "home-search-input"
- inputText: "a"
# 2+ chars trigger the debounced search query.
- eraseText
- inputText: "the"
- extendedWaitUntil:
    visible:
      id: "track-card"
    timeout: 30000
# With the keyboard up, the first tap on the list only dismisses it.
- hideKeyboard
- tapOn:
    id: "track-card"
# Playback started → persistent player bar shows the track title.
- extendedWaitUntil:
    visible:
      id: "player-track-title"
    timeout: 30000
